# Model registry (Python Engineering Standard ML-01, ML-04): every model the app can run, with the
# facts that identify it. Only facts written down in the project's docs, or visible in the app,
# are filled in. `null` means "not known yet"; it is never a guess.
#
# `sha256` is the SHA-256 of the language-model file. The three below were computed on the phone
# (`sha256sum`) on 2026-10-22, from the files the app runs with; the LFM2 value agrees with the
# shortened checksum in LFM2_VL_3B_LATENCY_FINDINGS.md. Still to fill in by someone with the files:
# `version` and `source` where they are `null`, the checksums of the other two models, and the
# 4B file names. The projector files' checksums are listed in the comments.
#
# Fields: name (registry id), version, source (where the file comes from), sha256, runtime,
# device (cpu or gpu; the shipped llama.cpp build is CPU only), file (the language-model .gguf the
# app finds in its models folder) and mmproj (its projector file). `file` and `mmproj` are the
# link from a file on the phone to its registry entry (see ADR 0005).
models:
  # Qwen3-VL-4B-Instruct: published by `Qwen`; Q4_K_M model 2,497 MB + Q8_0 projector 454 MB
  # (LFM2_VL_3B_LATENCY_FINDINGS.md). No file name is written down anywhere, so none is entered.
  - name: qwen3-vl-4b-instruct
    version: null
    source: Qwen
    sha256: null
    runtime: llama.cpp
    device: cpu
    file: null
    mmproj: null
  # Qwen3-VL-2B-Instruct: file names from QWEN3_VL_TWEAKS_LOG.md. No source or checksum written down.
  # Projector mmproj-qwen3vl-2b-instruct-q8_0.gguf (445,053,216 bytes) sha256 f9a68fabba69c3b81e153367b2c7521030b0fa8bb0de400c9599c8e6725f9c82.
  - name: qwen3-vl-2b-instruct
    version: null
    source: null
    sha256: 089d75c52f4b7ffc56ba998ffc50aae89fcafc755f9e7208aacca281dca6c2ae
    runtime: llama.cpp
    device: cpu
    file: qwen3vl-2b-instruct-q4_k_m.gguf
    mmproj: mmproj-qwen3vl-2b-instruct-q8_0.gguf
  # LFM2-VL-3B: publisher `LiquidAI` (official). Model 1,563,668,256 bytes, projector 586,769,376
  # bytes, "verified against Hugging Face" (LFM2_VL_3B_LATENCY_FINDINGS.md). The docs print only
  # shortened checksums (model 07b435d8...6f3ffe, projector 135dd0ee...f8dde9); the full values
  # computed on the phone agree with both. Projector sha256
  # 135dd0ee0a0ceb597fac0d8640dae6c86f28c7ca2cd5b88eb309c32fe8f8dde9.
  - name: lfm2-vl-3b
    version: null
