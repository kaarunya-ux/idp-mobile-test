    runtime: llama.cpp
    device: cpu
    file: LFM2-VL-3B-Q4_K_M.gguf
    mmproj: mmproj-LFM2-VL-3B-Q8_0.gguf
  # MiniCPM-V 4.6 (openbmb), GGUF from ggml-org. Model 529,101,536 bytes, projector 727,954,528
