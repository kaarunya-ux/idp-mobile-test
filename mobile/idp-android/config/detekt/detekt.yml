# Limits mirror the Python Engineering Standard (Ch. 19 and 27.2), which the Kotlin
# standard does not define: complexity 10, 50 lines per function, 7 parameters,
# 400 lines per file. See docs/adr/0003-kotlin-lint-and-format-gates.md.
complexity:
  CyclomaticComplexMethod:
    active: true
    threshold: 11
  LongMethod:
    active: true
    threshold: 50
  LongParameterList:
    active: true
    functionThreshold: 7
    constructorThreshold: 7
  LargeClass:
    active: true
    threshold: 400
  NestedBlockDepth:
    active: true
    threshold: 4
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
    thresholdInObjects: 20
    thresholdInClasses: 20
style:
  MaxLineLength:
    active: true
    maxLineLength: 120
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  ThrowsCount:
    active: true
    max: 2
  ForbiddenComment:
    active: true
    comments: ['TODO:', 'FIXME:', 'STOPSHIP:']
