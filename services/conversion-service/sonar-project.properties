# SonarQube analysis for conversion-service. CI runs `make check` first, which writes coverage.xml.
# The server URL and token come from CI variables (SONAR_HOST_URL, SONAR_TOKEN), never from this file.
sonar.projectKey=idp-conversion-service
sonar.projectName=IDP conversion-service
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
# Migrations are generated-style schema scripts; entry points are covered by the end-to-end test, not unit tests.
sonar.coverage.exclusions=migrations/**,src/conversion/worker.py,src/conversion/consumers.py,src/conversion/outbox_relay.py
