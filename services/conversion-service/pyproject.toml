[project]
name = "conversion-service"
version = "0.1.0"
description = "IDP conversion-service: conversions, PDF edits, merges, exports and previews (IDP-03 ch. 3)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
    "import-linter>=2.1",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "conversion"

# --- Lint and format (standard ch. 22.1) -------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "SIM", "PL", "RUF", "ASYNC", "DTZ", "T20", "ERA", "PT", "TID", "C90", "PERF"]

[tool.ruff.lint.per-file-ignores]
# pytest checks results with plain assert statements (S101), and tests compare against
# literal expected values on purpose (PLR2004).
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 7
max-statements = 50
max-branches = 12

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --- Types (standard PY-01) ---------------------------------------------------
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

# --- Tests (standard ch. 21) --------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "unit: fast tests with no external services",
    "integration: tests against real PostgreSQL, Redis, RabbitMQ or MinIO",
    "contract: messages checked against the AsyncAPI file",
    "golden: conversions checked against fixed inputs",
    "slow: excluded from make check",
]

# --- Architecture rules (standard ch. 21.6) -----------------------------------
# The "layers" contract (api -> application -> domain) arrives with the first application/infrastructure code.
[tool.importlinter]
root_package = "conversion"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core does not depend on features or entry points"
type = "forbidden"
source_modules = ["conversion.core"]
forbidden_modules = ["conversion.conversion", "conversion.health"]

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["conversion.conversion.domain"]
forbidden_modules = [
    "fastapi", "pydantic", "pydantic_settings", "sqlalchemy", "httpx", "celery", "faststream", "redis",
    "boto3", "structlog", "uvicorn", "conversion.core.config", "conversion.core.logging",
]
