[project]
name = "extraction-service"
version = "0.1.0"
description = "IDP extraction-service: reads documents into structured fields (IDP-03 ch. 2)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# API process only. OpenCV, ONNX Runtime and NumPy are in the `workers` extra below, so the API image never imports
# them (ML-09, DPL-05).
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    # UUIDv7 ids (DB-03, standard ch. 22.3); used by core/ids.py for ids and fallback correlation ids
    "uuid-utils>=0.9",
]

[project.optional-dependencies]
# Libraries only the OCR worker processes need (ML-09). All three CV/OCR libraries are on the approved list (standard
# ch. 22.3, "CV / OCR / ML"). Every library here is on that list; no YAML library is used (see ADR 0001).
workers = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.19",
    # Files (standard ch. 22.3): real file type from content (FIL-03), PDF pages (IDP-03 ch. 2.6 stage 2) and the image
    # size read from the header, before decoding, to refuse decompression bombs (FIL-05).
    "filetype>=1.2",
    "pypdfium2>=4.30",
    "pillow>=10.4",
]


[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
    "import-linter>=2.1",
    "hypothesis>=6.100",
    "pip-audit>=2.7",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# idp_ocr_engines is the library IDP-03 ch. 1 calls `idp-ocr-engines` (shared with conversion-service). It lives here
# until the idp-py-platform repository exists, and imports nothing from `extraction` so it can be lifted out as is.
module-name = ["extraction", "idp_ocr_engines"]

# --- Lint and format (standard ch. 22.1) -------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
# The flat prototype this service is replacing. It is moved into src/extraction/ step by step (git mv, then
# rewritten to the standard) and this exclusion is deleted with the last of it.
extend-exclude = ["ocr_test_app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "SIM", "PL", "RUF", "ASYNC", "DTZ", "T20", "ERA", "PT", "TID", "C90", "PERF"]

[tool.ruff.lint.per-file-ignores]
# pytest checks results with plain assert statements (S101) and compares against literal expected values on
# purpose (PLR2004).
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 7
max-statements = 50
max-branches = 12

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --- Types (standard PY-01) ---------------------------------------------------
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
# onnxruntime ships no type information. Only idp_ocr_engines.session touches it directly, and it hands typed values
# (NumPy arrays and our own exceptions) to everything else (PY-01: Any only at an untyped boundary).
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pypdfium2 and filetype ship no type information. Each is used by one module (the page loader), which turns their
# results into typed values before returning them (PY-01: Any only at an untyped boundary).
module = ["pypdfium2", "pypdfium2.*", "filetype", "filetype.*"]
ignore_missing_imports = true


# --- Tests (standard ch. 21) --------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "unit: fast tests with no external services",
    "integration: tests against real PostgreSQL, Redis, RabbitMQ or MinIO",
    "contract: messages checked against the AsyncAPI file",
    "golden: pipelines checked against fixed labelled inputs",
    "slow: excluded from make check",
]

# --- Architecture rules (standard ch. 21.6) -----------------------------------
# More contracts join as features are added: layers inside each feature, domain purity, "API does not touch
# infrastructure" and "features are independent" need at least one feature package to exist.
[tool.importlinter]
root_packages = ["extraction", "idp_ocr_engines"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core does not depend on features or entry points"
type = "forbidden"
source_modules = ["extraction.core"]
forbidden_modules = ["extraction.main", "extraction.health", "extraction.rule"]

[[tool.importlinter.contracts]]
name = "Rules are pure (no framework, no I/O, no configuration, no clock)"
type = "forbidden"
source_modules = ["extraction.rule"]
forbidden_modules = [
    "fastapi", "starlette", "pydantic", "pydantic_settings", "sqlalchemy", "httpx", "celery", "faststream",
    "redis", "boto3", "structlog", "uvicorn", "cv2", "onnxruntime", "numpy", "PIL", "pypdfium2",
    "extraction.core.config", "extraction.core.logging", "extraction.core.problem_details", "extraction.core.clock",
    "extraction.main", "extraction.health",
]

[[tool.importlinter.contracts]]
name = "idp_ocr_engines does not depend on the service (it must be liftable into idp-py-platform)"
type = "forbidden"
source_modules = ["idp_ocr_engines"]
forbidden_modules = ["extraction"]

[[tool.importlinter.contracts]]
name = "OCR data model and port stay pure (importable by the slim API image)"
type = "forbidden"
source_modules = [
    "idp_ocr_engines.model", "idp_ocr_engines.port", "idp_ocr_engines.errors", "idp_ocr_engines.languages",
]
forbidden_modules = ["numpy", "cv2", "onnxruntime", "yaml", "PIL", "fastapi", "pydantic", "structlog"]

[[tool.importlinter.contracts]]
name = "API process stays slim (no CV, OCR or ML libraries in its image)"
type = "forbidden"
source_modules = ["extraction.main", "extraction.health"]
forbidden_modules = ["cv2", "onnxruntime", "numpy", "PIL", "pypdfium2", "paddle", "torch", "yaml"]
