# The model registry (Python Engineering Standard ML-01). Code refers to models by `name`, never by path or URL.
#
#   version  what the model is called upstream; recorded in every result as provenance (ML-04)
#   source   where it was obtained, for people; nothing is downloaded at run time (ML-02)
#   runtime  how it is run (onnxruntime) and device (cpu); there is no silent fallback (ML-10)
#   entry    the file the runtime loads; it must also be listed under `files`
#   files    every file of the model, relative to OCR__MODELS_DIR, with its SHA-256; a mismatch stops the worker
#
# To add or change a model: put the files in the models directory, run `sha256sum` on each, edit this file, and
# attach the evaluation report (ML-12).

