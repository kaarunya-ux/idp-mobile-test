    quantization: UD-IQ4_XS
    source: huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF at revision a483e9e6cbd595906af30beda3187c2663a1118c (base model Qwen/Qwen3.6-35B-A3B, Apache-2.0)
    runtime: llama.cpp
