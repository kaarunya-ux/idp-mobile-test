[project]
name = "idox-conversion-service"
version = "0.1.0"
description = "Model-first document conversions (IDP-03 ch. 3): a vision model reads each page, libraries check and write the file."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# API process only: the health probes. Every library here is on the approved list (standard ch. 22.3). Libraries the
# conversion workers need join in later steps, each with a stated reason (DEP-02) and, when not on the list, an ADR.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "uuid-utils>=0.9",
]

[project.optional-dependencies]
# Libraries only the conversion workers need (ML-09): the model client and the page pictures. All are on the approved list
# (standard ch. 22.3): httpx and tenacity for outbound HTTP, Pillow for images.
workers = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "pillow>=10.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
    "import-linter>=2.1",
    "hypothesis>=6.100",
    "pip-audit>=2.7",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "idox_conversion"

# --- Lint and format (standard ch. 22.1) -------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
# The flat prototype this service is replacing (the idox scripts, the test page and the old tests). Its files are
# moved into src/idox_conversion/ step by step and rewritten to the standard; this exclusion goes with the last of them.
extend-exclude = ["python_scripts", "api", "web", "idocx_ai", "tests/test_*.py", "tests/_load.py", "tests/scan_fixtures.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "SIM", "PL", "RUF", "ASYNC", "DTZ", "T20", "ERA", "PT", "TID", "C90", "PERF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 7
max-statements = 50
max-branches = 12

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --- Types (standard PY-01) ---------------------------------------------------
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

# --- Tests (standard ch. 21) --------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "unit: fast tests with no external services",
    "integration: tests against real PostgreSQL, Redis, RabbitMQ or MinIO",
    "golden: conversions checked against fixed labelled inputs",
    "slow: excluded from make check",
]

# --- Architecture rules (standard ch. 21.6) -----------------------------------
# Layer contracts join as the feature packages are added (domain purity, "API does not touch infrastructure").
[tool.importlinter]
root_packages = ["idox_conversion"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core does not depend on entry points"
type = "forbidden"
source_modules = ["idox_conversion.core"]
forbidden_modules = ["idox_conversion.main", "idox_conversion.health"]

[[tool.importlinter.contracts]]
name = "API process stays slim (ML-09: no torch, paddle, onnxruntime or OpenCV in the API image)"
type = "forbidden"
source_modules = ["idox_conversion.main", "idox_conversion.health"]
forbidden_modules = ["torch", "paddle", "onnxruntime", "cv2"]

[[tool.importlinter.contracts]]
name = "Domain is pure (no framework, no I/O, no configuration, no clock)"
type = "forbidden"
source_modules = ["idox_conversion.conversion.domain"]
forbidden_modules = [
    "fastapi", "starlette", "pydantic", "pydantic_settings", "httpx", "celery", "faststream", "redis", "boto3",
    "structlog", "uvicorn", "cv2", "numpy", "PIL", "pypdfium2", "pymupdf", "pytesseract", "docx", "pptx", "openpyxl",
    "idox_conversion.core.config", "idox_conversion.core.logging", "idox_conversion.core.clock",
    "idox_conversion.main", "idox_conversion.health", "idox_conversion.conversion.application",
]
